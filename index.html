<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a1f36">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FE科目B">
    <meta name="description" content="基本情報技術者試験 科目B トレーサー">
    <title>FE科目B トレーサー</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>

    <header class="app-header">
      <div class="header-inner">
        <div class="header-text">
          <p class="header-eyebrow">基本情報技術者試験</p>
          <h1 class="header-title">科目B トレーサー</h1>
        </div>
        <div class="header-progress">
          <span id="progressText">1 / 1</span>
        </div>
      </div>
    </header>

    <nav class="pattern-nav" id="patternNav" aria-label="パターン選択">
      <!-- JS で生成 -->
    </nav>

    <main class="main-content" id="mainContent">

      <section class="card pattern-info-card">
        <h2 class="pattern-title" id="patternTitle">読み込み中...</h2>
        <p class="pattern-desc" id="patternDescription"></p>
      </section>

      <section class="card step-card" aria-live="polite">
        <div class="step-header">
          <span class="step-badge" id="stepBadge">1</span>
          <span class="step-title" id="stepTitle"></span>
        </div>
        <p class="step-note" id="stepNote"></p>
      </section>

      <section class="code-section" aria-label="擬似コード">
        <div class="section-label">擬似コード</div>
        <div class="code-panel" id="codePanel">
          <!-- JS で生成 -->
        </div>
      </section>

      <section class="var-section" aria-label="変数の状態">
        <div class="section-label">変数の状態</div>
        <table class="var-table">
          <thead>
            <tr>
              <th>変数</th>
              <th>値</th>
              <th>変化</th>
            </tr>
          </thead>
          <tbody id="varBody">
            <!-- JS で生成 -->
          </tbody>
        </table>
      </section>

      <div class="nav-bar" role="group" aria-label="ステップ移動">
        <button class="nav-btn" id="btnFirst" type="button">最初</button>
        <button class="nav-btn" id="btnPrev"  type="button">戻る</button>
        <span class="nav-progress" id="navProgress">1 / 1</span>
        <button class="nav-btn nav-btn-primary" id="btnNext" type="button">次へ</button>
        <button class="nav-btn" id="btnLast"  type="button">最後</button>
      </div>

    </main>

    <script src="js/app.js" defer></script>
  </body>
</html>
